name: Apply attached patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply requested patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and remove temporary files
        run: |
          set -euo pipefail
          test -f 01a09e8d-7a10-7107-8a99-19c0429f6cde.patch
          git apply --check 01a09e8d-7a10-7107-8a99-19c0429f6cde.patch
          git apply 01a09e8d-7a10-7107-8a99-19c0429f6cde.patch
          git rm 01a09e8d-7a10-7107-8a99-19c0429f6cde.patch
          git rm .github/workflows/apply-attached-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Apply requested patch'
          git push origin HEAD:main
