name: Apply DND patch helper
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[apply dnd patch]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply uploaded patch to PR branch
        shell: bash
        env:
          TARGET_BRANCH: patch/chapter-i-dnd-astra
        run: |
          set -euo pipefail
          git fetch origin main "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git worktree add --detach /tmp/target "refs/remotes/origin/${TARGET_BRANCH}"
          cd /tmp/target
          git show origin/main:01a075c4-5a21-7c2a-9742-e1ca6a97a8d2.patch > /tmp/changes.patch
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('/tmp/changes.patch').read_text(encoding='utf-8', errors='replace')
          blocks = patch.split('diff --git ')[1:]
          text_blocks = []
          readme_blocks = []
          for block in blocks:
              lines = block.splitlines()
              path = lines[0].split(' b/', 1)[1]
              if 'Binary files' in block:
                  continue
              if path == 'README.md':
                  readme_blocks.append(block)
                  continue
              text_blocks.append('diff --git ' + block)
              if 'new file mode' in block:
                  p = Path(path)
                  if p.exists():
                      p.unlink()
          Path('/tmp/text.patch').write_text(''.join(text_blocks), encoding='utf-8')
          if len(readme_blocks) != 1:
              raise SystemExit(f'Expected one README patch block; found {len(readme_blocks)}')
          readme = []
          in_hunk = False
          for line in readme_blocks[0].splitlines():
              if line.startswith('@@ '):
                  in_hunk = True
                  continue
              if in_hunk and (line.startswith('+') or line.startswith(' ')):
                  readme.append(line[1:])
          Path('README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          PY
          git apply --index --whitespace=nowarn /tmp/text.patch
          rm -f .github/workflows/apply-patch.yml 01a075c4-5a21-7c2a-9742-e1ca6a97a8d2.patch
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Apply uploaded patch changes'
            git push origin HEAD:${TARGET_BRANCH}
          fi
          cd - >/dev/null
          git worktree remove /tmp/target --force

      - name: Remove helper from main
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/_apply-dnd-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary patch applicator'
          git push origin main

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "${GITHUB_REPOSITORY}"
