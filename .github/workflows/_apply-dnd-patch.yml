name: Apply DND patch helper
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  apply:
    if: github.event.comment.body == '/apply-dnd-patch' && github.event.issue.number == 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply patch
        shell: bash
        env:
          TARGET_BRANCH: patch/chapter-i-dnd-astra
        run: |
          set -euo pipefail
          git fetch origin
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/6/comments" --jq '.[] | select(.body | startswith("PATCH_CHUNK ")) | .body' > /tmp/comments.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          text=Path('/tmp/comments.txt').read_text()
          chunks={}
          total=None
          for m in re.finditer(r'PATCH_CHUNK (\d+)/(\d+)\n([A-Za-z0-9+/=]+)', text):
              i=int(m.group(1)); total=int(m.group(2)); chunks[i]=m.group(3)
          if total is None or len(chunks)!=total or set(chunks)!=set(range(1,total+1)):
              raise SystemExit(f'Expected {total} chunks, got {sorted(chunks)}')
          raw=gzip.decompress(base64.b64decode(''.join(chunks[i] for i in range(1,total+1))))
          Path('/tmp/changes.patch').write_bytes(raw)
          print('Reconstructed',len(raw),'bytes')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/changes.patch').read_text(encoding='utf-8',errors='replace')
          blocks=[]
          for block in p.split('diff --git ')[1:]:
              if 'Binary files' not in block: blocks.append('diff --git '+block)
          Path('/tmp/text.patch').write_text(''.join(blocks),encoding='utf-8')
          PY
          git apply --index --3way --whitespace=nowarn /tmp/text.patch || git apply --index --whitespace=nowarn /tmp/text.patch
          rm -f .github/workflows/apply-patch.yml .github/workflows/_apply-dnd-patch.yml 01a075c4-5a21-7c2a-9742-e1ca6a97a8d2.patch
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply uploaded patch changes'
          git push origin HEAD:"$TARGET_BRANCH"
      - name: Remove helper from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/_apply-dnd-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary patch applicator'
          git push origin main
      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close 6 --repo "${GITHUB_REPOSITORY}"
