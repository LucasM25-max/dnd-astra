name: Apply DND patch helper
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.comment.body == '/diag' && github.event.issue.number == 4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose and apply patch
        shell: bash
        env:
          TARGET_BRANCH: patch/chapter-i-dnd-astra
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          LOG=/tmp/apply.log
          : > "$LOG"
          run_cmd() {
            echo "" >> "$LOG"
            echo "\$ $*" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            rc=$?
            echo "RC=$rc" >> "$LOG"
            return $rc
          }
          run_cmd git fetch origin
          if [ $? -ne 0 ]; then false; fi
          run_cmd git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          if [ $? -ne 0 ]; then false; fi
          run_cmd git show origin/main:01a075c4-5a21-7c2a-9742-e1ca6a97a8d2.patch
          if [ $? -ne 0 ]; then false; fi
          git show origin/main:01a075c4-5a21-7c2a-9742-e1ca6a97a8d2.patch > /tmp/changes.patch
          python3 - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path
          patch = Path('/tmp/changes.patch').read_text(encoding='utf-8', errors='replace')
          blocks = patch.split('diff --git ')[1:]
          text_blocks, readme_blocks = [], []
          for block in blocks:
              lines = block.splitlines()
              path = lines[0].split(' b/', 1)[1]
              if 'Binary files' in block:
                  continue
              if path == 'README.md':
                  readme_blocks.append(block)
                  continue
              text_blocks.append('diff --git ' + block)
              if 'new file mode' in block:
                  p = Path(path)
                  if p.exists():
                      p.unlink()
          Path('/tmp/text.patch').write_text(''.join(text_blocks), encoding='utf-8')
          if len(readme_blocks) != 1:
              raise SystemExit(f'Expected one README patch block; found {len(readme_blocks)}')
          readme, in_hunk = [], False
          for line in readme_blocks[0].splitlines():
              if line.startswith('@@ '):
                  in_hunk = True
                  continue
              if in_hunk and (line.startswith('+') or line.startswith(' ')):
                  readme.append(line[1:])
          Path('README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          print('Prepared text patch:', len(text_blocks), 'blocks; README rebuilt:', len(readme), 'lines')
          PY
          run_cmd git apply --index --whitespace=nowarn /tmp/text.patch
          if [ $? -ne 0 ]; then
            tail -c 9000 "$LOG" | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
            false
          fi
          echo 'PATCH APPLY SUCCEEDED' >> "$LOG"
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-patch.yml 01a075c4-5a21-7c2a-9742-e1ca6a97a8d2.patch
          git commit -m 'Apply uploaded patch changes'
          git push origin HEAD:"$TARGET_BRANCH"
          tail -c 9000 "$LOG" | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "${GITHUB_REPOSITORY}"
