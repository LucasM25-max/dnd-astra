name: Apply repository patch
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  apply:
    if: github.event.issue.title == '[apply patch v3-final]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: patch/chapter-i-final-20260906
      PATCH_PATH: 01a075c4-5a21-7c2a-9742-e1ca6a97a8d2.patch
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply patch targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -c "$TARGET_BRANCH" origin/main
          git show "origin/main:$PATCH_PATH" > /tmp/changes.patch
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('/tmp/changes.patch').read_text(encoding='utf-8', errors='replace')
          blocks = patch.split('diff --git ')[1:]
          apply_blocks = []
          for block in blocks:
              lines = block.splitlines()
              if not lines:
                  continue
              path = lines[0].split(' b/', 1)[1]
              if path == 'package-lock.json' or 'Binary files' in block:
                  continue
              if path == 'README.md':
                  out = []
                  in_hunk = False
                  for line in lines:
                      if line.startswith('@@ '):
                          in_hunk = True
                          continue
                      if in_hunk and (line.startswith('+') or line.startswith(' ')):
                          out.append(line[1:])
                  Path(path).write_text('\n'.join(out) + '\n', encoding='utf-8')
                  continue
              if 'new file mode' in block:
                  p = Path(path)
                  if p.exists():
                      p.unlink()
              apply_blocks.append('diff --git ' + block)
          Path('/tmp/text.patch').write_text(''.join(apply_blocks), encoding='utf-8')
          PY
          git apply --index --whitespace=nowarn /tmp/text.patch
          rm -f "$PATCH_PATH" .github/workflows/apply-repository-patch.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply Chapter I changes from uploaded patch'
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Delete patch and workflow from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git switch main
          git pull --ff-only origin main
          git rm -f "$PATCH_PATH" .github/workflows/apply-repository-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary patch and applicator'
          git push origin main

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
