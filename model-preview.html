<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero Model Preview (temp harness)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10160f; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #panel {
      position: fixed; top: 10px; left: 10px; z-index: 10; max-width: 300px;
      background: rgba(16, 24, 17, 0.88); border: 1px solid #d0b781; border-radius: 8px;
      color: #efe9d7; font: 12px/1.5 system-ui, sans-serif; padding: 10px 12px;
    }
    #panel h3 { margin: 0 0 6px; font-size: 13px; color: #e3cea1; }
    #panel .row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    #panel button, #panel select {
      background: #29342b; color: #efe9d7; border: 1px solid #5a6a58;
      border-radius: 4px; padding: 3px 7px; font-size: 11px; cursor: pointer;
    }
    #panel button.on { border-color: #e3cea1; color: #e3cea1; }
    #panel label { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    #panel input[type="range"] { flex: 1; }
    #panel.hide { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="panel"></div>
  <script type="module" src="/src/model-preview.ts"></script>
</body>
</html>
